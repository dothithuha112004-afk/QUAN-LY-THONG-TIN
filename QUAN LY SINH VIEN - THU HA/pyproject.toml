[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-management"
version = "1.0.0"
description = "Hệ thống quản lý lớp học 3 tầng phân quyền Giáo viên, Sinh viên, Admin kết nối SQL Server và Vercel"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "HuyHago1111" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pyodbc>=5.1.0"
]

[tool.setuptools]
packages = ["classroom_management", "api"]
